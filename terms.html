addEventListener('wheel',e=>{ if(e.target.closest('#card'))return; camT.dist=Math.max(260,Math.min(3400,camT.dist*Math.exp(e.deltaY*.0012))); idle=0; },{passive:true});
addEventListener('keydown',e=>{ if(e.key==='Escape'){ if(card) closeCard(); else if(focusG) setGroup(null); } if(e.key==='/'&&document.activeElement!==$('q')){ e.preventDefault(); $('q').focus(); } });
// ---------- boot ----------
resize(); addEventListener('resize',resize);
document.fonts.ready.then(()=>{ layout();
  const hp=new URLSearchParams(location.hash.slice(1)); if(hp.get('group')&&CL[hp.get('group')]) setGroup(hp.get('group')); if(hp.get('term')&&BY[hp.get('term')]) openTerm(BY[hp.get('term')],{silentHash:true});
  if(hp.has('demo')&&card&&card.demo){ build(card.demo); rT0=-1e3; }
  Object.assign(cam,camT); });
let last=performance.now(); function loop(now){ const dt=Math.min(.05,(now-last)/1000); last=now; render(dt); requestAnimationFrame(loop);} requestAnimationFrame(loop);
</script>
