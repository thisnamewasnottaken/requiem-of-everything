<script type="module">
import { sound } from './common/sound.js';
await sound.useHQ('samples/manifest.json');
const D=window.ROE_DATA, INST=Object.fromEntries(D.instruments.map(i=>[i.id,i])), COMP=Object.fromEntries(D.composers.map(c=>[c.id,c]));
const LIVES=window.ROE_LIVES||{}, XTRA=window.ROE_INSTR_EXTRA||{}, ERAN=Object.fromEntries(D.eras.map(e=>[e.id,e.name]));
const {S,L,PIECES,ringR,layoutSeats,pieceDefs}=window.ROE_HALL;
const $=id=>document.getElementById(id);
const cv=$('hall'), g=cv.getContext('2d'), hz=$('haze'); let W,H,DPR; const HS=.5;
const gl=hz.getContext('webgl',{antialias:false,alpha:false,premultipliedAlpha:false});
let fitTargets=[],fitCarpets={},fitWarningShown=false,cameraReady=false;
function resize(){DPR=Math.min(devicePixelRatio,2);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;g.setTransform(DPR,0,0,DPR,0,0);hz.width=Math.round(W*HS);hz.height=Math.round(H*HS);gl&&gl.viewport(0,0,hz.width,hz.height);if(cameraReady)fitCamera();}
resize(); addEventListener('resize',resize);
let silent=localStorage.getItem('roe-sound')==='off';
const P=(id,m,o={})=>{
  if(silent)return;
  const n=o.tag?[...seats.values()].filter(s=>s.sid===o.tag&&!s.dead).length:0;
  const count=n>2?(n>7?3:2):1, when=o.when??sound.now();
  for(let i=0;i<count;i++){
    const options=o.tag?{...o,voices:1}:o;
    if(count>1){
      options.when=when+Math.random()*.03;
      options.vel=(o.vel??.7)*(.9+Math.random()*.2);
      options.detune=(o.detune??0)+(Math.random()<.5?-1:1)*(4+Math.random()*4);
    }
    sound.play(id,m,options);
  }
};
const FAMN={strings:'Strings',winds:'Woodwinds',brass:'Brass',perc:'Percussion',keys:'Keyboards',voices:'Voices'};
const LOCAL={lute:{name:'Lute & Theorbo',role:'Plucked harmony for songs, dances and early opera',description:'Plucked strings with a rounded back. The long-necked theorbo, its bass cousin, filled in the harmony of early operas and songs alongside the harpsichord.'},
 cor:{name:'Cornett',role:'The virtuoso\u2019s wind instrument of 1600',description:'A curved wooden horn with finger holes and a trumpet-style mouthpiece. Players were prized because it could imitate the human voice so closely.'}};
const ERA_OF={renaissance:'renaissance',baroque:'baroque',classical:'classical','early-romantic':'romantic','late-romantic':'romantic',modern:'modern'};
PIECES.forEach(p=>p.composer=D.composers.find(c=>c.shortName===p.who)?.id);
// ---------- seats ----------
let WING=11;
const seats=new Map(), CAR={}; let current={}, active={}, hoverS=null, focusS=new Set(), card=null, mouse={x:-99,y:-99}, st={era:'classical'};
let pendingSync=false, syncTimer=0, wasMoving=false, cacT=0, baton=0, T=0;
function apply(defs,meta){ current=meta; const {out:tgt,carp}=layoutSeats(defs); fitTargets=tgt; fitCarpets=carp; WING=Math.max(11,tgt.reduce((max,t)=>Math.max(max,Math.hypot(t.x,t.z)),0)+2); const keep=new Set(); clearTimeout(syncTimer);
  for(const t of tgt){ keep.add(t.key); let s=seats.get(t.key);
    if(!s){ const side=t.x<0?-1:1; s={key:t.key,sid:t.sid,cx:side*WING,cz:t.z,a:0,ph:Math.random()*6.28,delay:.4+Math.random()*2.2,speed:2.1+Math.random()*.9}; seats.set(t.key,s); }
    else { s.delay=Math.random()*1.1; }
    s.cx=(t.x<0?-1:1)*WING;
    s.x=t.x; s.z=t.z; s.dead=false; }
  for(const [k,s] of seats) if(!keep.has(k)&&!s.dead){ s.dead=true; s.cx=(s.cx<0?-1:1)*WING; s.x=s.cx; s.z=s.cz; s.delay=Math.random()*.9; }
  for(const sid in CAR) CAR[sid].on=false;
  for(const sid in carp){ const c=CAR[sid]; if(c){c.t=carp[sid];c.on=true;} else CAR[sid]={...carp[sid],t:carp[sid],al:0,on:true}; }
  $('iYear').textContent=meta.year; $('iName').textContent=meta.name; $('iLead').textContent=meta.lead; $('iText').textContent=meta.text;
  $('iCount').textContent=tgt.length+' performers on stage'; pendingSync=true; renderComposers(); fitCamera(); }
// ---------- filters & URL ----------
function layoutFor(era){ return L[era].s; }
function curComposer(){ return st.composer?COMP[st.composer]:st.piece?COMP[PIECES.find(p=>p.id===st.piece)?.composer]:null; }
function renderComposers(){ const c=curComposer(); const el=$('iComp');
  if(c){ el.innerHTML=`Composer · <a class="who" data-c="${c.id}">${c.name}</a>`; return; }
  const eras=(L[st.era]||{}).eras||[]; const cs=D.composers.filter(x=>eras.includes(x.era)).sort((a,b)=>b.compositionIds.length-a.compositionIds.length).slice(0,5);
  el.innerHTML=cs.length?'Composers of this era · '+cs.map(x=>`<a class="who" data-c="${x.id}">${x.shortName}</a>`).join(', '):''; }
function setHash(){ const p=new URLSearchParams(); if(st.piece)p.set('piece',st.piece); else if(st.composer)p.set('composer',st.composer); else p.set('era',st.era);
  if(st.instrument)p.set('instrument',st.instrument); history.replaceState(null,'','#'+p.toString()); }
function mark(){ const era=st.piece?PIECES.find(p=>p.id===st.piece).era:st.era;
  eraBox.querySelectorAll('.btn').forEach(b=>b.classList.toggle('on',b.dataset.id===era&&!st.piece&&!st.composer));
  pBox.querySelectorAll('.btn').forEach(b=>b.classList.toggle('on',b.dataset.id===st.piece));
  $('fComposer').value=st.composer||''; $('fInstr').value=st.instrument||''; }
function setEra(id,keepI){ st={era:id,instrument:keepI?st.instrument:undefined}; apply(layoutFor(id),L[id]); mark(); setHash(); }
function setPiece(p,asComposer){ st={era:p.era,piece:asComposer?undefined:p.id,composer:asComposer}; apply(pieceDefs(p),{...p,name:p.label.split(' · ')[1]}); mark(); setHash(); }
function setComposer(id){ const c=COMP[id]; if(!c)return; const p=PIECES.find(p=>p.composer===id);
  if(p) setPiece(p,id); else { const e=ERA_OF[c.era]; st={era:e,composer:id}; apply(layoutFor(e),{...L[e],year:`${c.birthYear} – ${c.deathYear}`,name:`${c.shortName}\u2019s orchestra`,lead:`${L[e].name}, as ${c.shortName} knew it`}); mark(); setHash(); }
  openComposer(id); }
const sidsFor=iid=>Object.keys(S).filter(k=>S[k][2]===iid||(iid==='snare-drum'&&k==='pc'));
const present=()=>[...new Set([...seats.values()].filter(s=>!s.dead).map(s=>s.sid))];
function setInstrument(iid){ if(!iid){ st.instrument=undefined; focusS=new Set(); closeCard(); mark(); setHash(); return; }
  const sids=sidsFor(iid); if(!sids.length)return; const inLayout=(defs)=>defs.some(d=>sids.includes(d[0])&&d[1]>0);
  const curDefs=st.piece?pieceDefs(PIECES.find(p=>p.id===st.piece)):layoutFor(st.era);
  if(!inLayout(curDefs)){ const e=['classical','romantic','modern','baroque','renaissance'].find(e=>inLayout(L[e].s)); if(e) setEra(e); }
  st.instrument=iid; focusS=new Set(sids); const curPresent=(st.piece?pieceDefs(PIECES.find(p=>p.id===st.piece)):layoutFor(st.era)).map(d=>d[0]);
  openInstrument(sids.find(s=>curPresent.includes(s))||sids[0]); mark(); setHash(); }
const eraBox=$('eras'), pBox=$('pieces');
Object.entries(L).forEach(([id])=>{const b=document.createElement('button');b.className='btn';b.textContent=id;b.dataset.id=id;b.onclick=()=>setEra(id);eraBox.appendChild(b);});
PIECES.forEach(p=>{const b=document.createElement('button');b.className='btn';b.textContent=p.label;b.dataset.id=p.id;b.onclick=()=>setPiece(p);pBox.appendChild(b);});
$('fComposer').innerHTML='<option value="">Composer…</option>'+[...D.composers].sort((a,b)=>a.birthYear-b.birthYear).map(c=>`<option value="${c.id}">${c.name} (${c.birthYear}–${c.deathYear})</option>`).join('');
const FAMS={strings:'Strings',woodwinds:'Woodwinds',brass:'Brass',percussion:'Percussion',keyboards:'Keyboards',voice:'Voices'};
$('fInstr').innerHTML='<option value="">Instrument or voice…</option>'+Object.entries(FAMS).map(([f,n])=>`<optgroup label="${n}">${D.instruments.filter(i=>i.family===f).map(i=>`<option value="${i.id}">${i.name}</option>`).join('')}</optgroup>`).join('');
$('fComposer').onchange=e=>{ sound.unlock(); e.target.value?setComposer(e.target.value):setEra(st.era); };
$('fInstr').onchange=e=>{ sound.unlock(); setInstrument(e.target.value); };
$('bShare').onclick=()=>{ const b=$('bShare'); navigator.clipboard?.writeText(location.href).then(()=>{b.textContent='Link copied';setTimeout(()=>b.textContent='Share this view',1800);}).catch(()=>{}); };
const bS=$('bSilence'); const paintS=()=>{bS.textContent=silent?'Silence':'Sounding';bS.classList.toggle('on',!silent);bS.setAttribute('aria-pressed',!silent);}; paintS();
bS.onclick=()=>{silent=!silent;localStorage.setItem('roe-sound',silent?'off':'on');paintS();};
addEventListener('storage',e=>{ if(e.key==='roe-sound'){ silent=e.newValue==='off'; paintS(); } });
document.addEventListener('click',e=>{ const a=e.target.closest('a.who'); if(a){ e.preventDefault(); sound.unlock(); openComposer(a.dataset.c); } });
// ---------- cards ----------
const ERAS=['renaissance','baroque','classical','early-romantic','late-romantic','modern'];
function openInstrument(sid){ const [label,fam,iid]=S[sid]; const I=INST[iid]||LOCAL[sid]||{}; const X=XTRA[iid]; card={kind:'inst',sid};
  const goat=X&&X.goat?(typeof X.goat==='string'?{name:X.goat}:X.goat):null; const sc=X&&X.showcase;
  const pr=Object.fromEntries((I.eraProminence||[]).map(p=>[p.era,p.prominence])); const HH={primary:1,secondary:.6,occasional:.3,rare:.15};
  $('card').innerHTML=`<div class="k">${FAMN[fam]} · ${label}</div><h3>${I.name||label}</h3>${I.range?`<div class="k dim">Range ${I.range}</div>`:''}
   <p class="role">${I.role||''}</p><p>${I.description||''}</p>
   ${sc?`<div class="show"><div class="k">Hear it shine</div><b>${sc.title}</b><i>${sc.composerId?`<a class="who" data-c="${sc.composerId}">${sc.composerName}</a>`:sc.composerName} · ${sc.year}</i><p>${sc.why}</p><a class="btn" href="${sc.spotifyUrl}" data-roe-key="instr:${iid}">Listen on Spotify</a><div class="spotify-player"></div></div>`:''}
   ${goat?`<div class="goat"><span class="k">Widely called the greatest</span><b>${goat.name}</b>${goat.note?`<span class="n">${goat.note}</span>`:''}</div>`:''}
   ${X&&X.greats&&X.greats.length?`<div class="k">Great players</div><ul>${X.greats.map(p=>`<li><b>${p.name}</b> · ${p.note}</li>`).join('')}</ul>`:''}
   ${I.eraProminence?`<div class="k">Through the eras</div><div class="eras">${ERAS.map(e=>`<span><i style="height:${(HH[pr[e]]||0)*100}%"></i>${e.replace('-romantic','-rom')}</span>`).join('')}</div>`:''}
   <div class="row"><button class="btn" id="cHear">Hear it alone</button></div>`;
  $('cHear').onclick=()=>{sound.unlock().then(()=>motif(sid,.7,0,.4));};
  $('card').classList.add('open'); $('card').scrollTop=0; $('hint').style.opacity=0; if(sound.started) motif(sid,.6,0,.34); }
function openComposer(id){ const c=COMP[id]; if(!c)return; card={kind:'comp',id}; const Lf=LIVES[id];
  const works=D.compositions.filter(w=>w.composerId===id).sort((a,b)=>a.yearComposed-b.yearComposed).slice(0,5);
  const seated=st.composer===id||(st.piece&&PIECES.find(p=>p.id===st.piece)?.composer===id);
  $('card').innerHTML=`<div class="k">${ERAN[c.era]||c.era} · ${c.nationality}</div><h3>${c.name}</h3><div class="k dim">${c.birthYear} – ${c.deathYear} · ${c.birthPlace}</div>
   ${Lf?`<canvas id="mini"></canvas><div class="mlg"><span><i style="background:#e7c784"></i>music written</span><span><i style="background:#cfe0ff"></i>public standing</span></div>`:''}
   <div class="bio">${c.biography}</div>
   <div class="k">Works to hear</div><ul>${works.map(w=>`<li><b>${w.title}</b> · ${w.yearComposed}<a href="${w.spotifyUrl}" data-roe-key="${w.id}">Listen on Spotify</a><div class="spotify-player"></div></li>`).join('')}</ul>
   <div class="row"><a class="btn" href="river.html#focus=${id}">Follow the life in the River</a>${seated?'':'<button class="btn" id="cSeat">Seat their orchestra</button>'}</div>`;
  if(!seated) $('cSeat').onclick=()=>setComposer(id);
  $('card').classList.add('open'); $('card').scrollTop=0; $('hint').style.opacity=0; if(Lf) requestAnimationFrame(()=>drawMini(c,Lf)); }

    bx=pc.x+14*cs+(mouse.x-pc.x)*.04; by=pc.y-40*cs-up*26*cs-(baton>0?Math.abs(Math.sin(T*3.2))*8:Math.abs(Math.sin(T*1.4))*3)*cs+(mouse.y-pc.y)*.02; ex=bx+16*cs; ey=by-12*cs-up*6*cs;
    g.strokeStyle='rgba(255,240,210,.9)'; g.lineWidth=1.4*cs; g.beginPath(); g.moveTo(pc.x+5*cs,pc.y-26*cs); g.lineTo(bx,by); g.lineTo(ex,ey); g.stroke(); }
  else { bx=W/2; by=pc.y-26; let ang=mouse.x<0?-1.25:Math.atan2(mouse.y-by,mouse.x-bx); if(ang>0) ang=ang>Math.PI/2?-2.6:-.55; ang=Math.max(-2.6,Math.min(-.55,ang));
    ang+=(baton>0?Math.sin(T*3.2)*.12:Math.sin(T*1.1)*.03); const L=Math.min(H*.3,290)*(1+up*.12); ex=bx+Math.cos(ang)*L; ey=by+Math.sin(ang)*L;
    const nx=-Math.sin(ang), ny=Math.cos(ang); g.fillStyle='rgba(255,240,210,.88)'; g.beginPath(); g.moveTo(bx+nx*2.6,by+ny*2.6); g.lineTo(ex+nx*.5,ey+ny*.5); g.lineTo(ex-nx*.5,ey-ny*.5); g.lineTo(bx-nx*2.6,by-ny*2.6); g.closePath(); g.fill();
    g.globalCompositeOperation='lighter'; const hg=g.createRadialGradient(bx,by,0,bx,by,26); hg.addColorStop(0,'rgba(255,214,160,.45)'); hg.addColorStop(1,'rgba(255,214,160,0)'); g.fillStyle=hg; g.fillRect(bx-26,by-26,52,52); g.globalCompositeOperation='source-over';
    g.fillStyle='rgba(40,30,22,.95)'; g.beginPath(); g.ellipse(bx,by+3,6,4,0,0,7); g.fill(); g.strokeStyle='rgba(239,212,151,.6)'; g.lineWidth=1; g.stroke(); }
  g.globalCompositeOperation='lighter'; const bg=g.createRadialGradient(ex,ey,0,ex,ey,30+up*30); bg.addColorStop(0,`rgba(255,240,210,${.45+up*.4})`); bg.addColorStop(1,'rgba(255,240,210,0)'); g.fillStyle=bg; g.fillRect(ex-70,ey-70,140,140); g.globalCompositeOperation='source-over';
  const cc=curComposer(); if(cc){ g.font='12px Cinzel'; g.letterSpacing='3px'; g.fillStyle=onPodium(mouse.x,mouse.y)?'#fff3da':'rgba(239,212,151,.85)'; g.shadowColor='#000'; g.shadowBlur=8; g.fillText(cc.name.toUpperCase(),pc.x,pod?pc.y:pc.y+14*cs); g.shadowBlur=0; g.letterSpacing='0px'; }
  // haze
  if(uh){ const n=Math.min(24,cones.length), A=new Float32Array(96), B=new Float32Array(96), C=new Float32Array(72);
    cones.slice(0,n).forEach((c,i)=>{ A.set([c.L0.x*HS,(H-c.L0.y)*HS,c.F.x*HS,(H-c.F.y)*HS],i*4); B.set([c.r0*HS,c.r1*HS,c.I,0],i*4); C.set(c.col,i*3); });
    gl.uniform2f(uh.res,hz.width,hz.height); gl.uniform1f(uh.t,T); gl.uniform4fv(uh.a,A); gl.uniform4fv(uh.b,B); gl.uniform3fv(uh.c,C); gl.uniform1i(uh.n,n);
    const sc=proj(0,3.2); gl.uniform3f(uh.st,sc.x*HS,(H-sc.y)*HS,W*.42*HS); gl.drawArrays(gl.TRIANGLES,0,3); } }
// ---------- interaction & sound ----------
const tip=$('tip'); let lastPlay=0;
function podPt(){ if(camName==='podium') return {x:W/2,y:$('dock').getBoundingClientRect().top-14,s:1}; const q=proj(0,-.35); return {x:q.x,y:q.y,s:Math.max(.6,Math.min(1.8,q.p/.95))}; }
function onPodium(mx,my){ const pc=podPt(), s=pc.s; if(camName==='podium') return !!curComposer()&&Math.abs(mx-pc.x)<110&&Math.abs(my-pc.y)<18; return Math.abs(mx-pc.x)<(curComposer()?90:30*s)&&my>pc.y-48*s&&my<pc.y+24*s; }
function pickSection(mx,my){ let best=null,bd=1e9; for(const s of seats.values()){ if(s.dead)continue; const q=proj(s.cx,s.cz); const d=Math.hypot(q.x-mx,q.y-10*q.p-my); if(d<bd&&d<24*q.p+8){bd=d;best=s.sid;} } return best; }
cv.addEventListener('pointermove',e=>{ mouse={x:e.clientX,y:e.clientY}; const s=pickSection(e.clientX,e.clientY), pod=!s&&onPodium(e.clientX,e.clientY);
  if(s!==hoverS){ hoverS=s; if(s&&sound.started&&!wasMoving&&performance.now()-lastPlay>160){lastPlay=performance.now(); motif(s,.38);} }
  if(s){ const n=[...seats.values()].filter(o=>o.sid===s&&!o.dead).length; tip.innerHTML=`<b>${S[s][0]}</b><span>${n} player${n>1?'s':''} · ${FAMN[S[s][1]]} · click to meet</span>`; }
  else if(pod){ const c=curComposer(); tip.innerHTML=c?`<b>${c.name}</b><span>click to meet the composer</span>`:`<b>The podium</b><span>pick a composer or piece below</span>`; }
  if(s||pod){ tip.style.opacity=1; tip.style.left=Math.min(e.clientX+16,W-260)+'px'; tip.style.top=(e.clientY+16)+'px'; cv.style.cursor='pointer'; } else { tip.style.opacity=0; cv.style.cursor=''; } });
cv.addEventListener('click',e=>{ sound.unlock(); const s=pickSection(e.clientX,e.clientY);
  if(s){ st.instrument=S[s][2]||undefined; focusS=new Set(); openInstrument(s); mark(); setHash(); return; }
  if(onPodium(e.clientX,e.clientY)&&curComposer()){ openComposer(curComposer().id); return; }
  closeCard(); });
function sectionPan(sid){ const s=[...seats.values()].filter(o=>o.sid===sid&&!o.dead); if(!s.length)return 0; return Math.max(-.9,Math.min(.9,s.reduce((a,o)=>a+o.x,0)/s.length/6)); }
function motif(sid,vel=.55,t0=0,step=.28){ const [,,,patch,notes]=S[sid]; const n=[...seats.values()].filter(o=>o.sid===sid&&!o.dead).length; const voices=Math.min(4,Math.max(1,Math.round(Math.sqrt(n))));
  notes.forEach((m,i)=>P(patch,m,{when:sound.now()+t0+i*step,dur:step*1.6,vel,voices,pan:sectionPan(sid),tag:sid})); }
sound.onNote(n=>{ if(!n.tag)return; const delay=Math.max(0,(n.when-sound.now())*1000); setTimeout(()=>{active[n.tag]=Math.min(1,(active[n.tag]||0)*.5+.9*n.vel+.3);},delay); });
async function preload(){ const ids=new Set([...present().map(sid=>S[sid][3]),'oohs']); await Promise.all([...ids].map(id=>sound.load(id))); }
const ORDER=['cb','vc','viol','va','v2','v1','hc','fp','lute','org','bas','ten','alt','sop','rec','bn','cl','ob','fl','pic','cor','sack','hn','tb','tu','tp','hp','cel','ti','pc'];
const CHORD={cb:[38],vc:[50,57],va:[62],v2:[66],v1:[74,78],viol:[50,57],hc:[62,66,69],fp:[62,66,69],org:[38,50,57],sop:[74,78],alt:[66,69],ten:[57,62],bas:[43,50],lute:[62,69],rec:[74],bn:[50],cl:[69],ob:[74],fl:[81],pic:[86],cor:[74],sack:[50,57],hn:[62,66],tb:[50,57],tu:[38],tp:[74,78],hp:[50,57,62,66,69,74],cel:[86,90],ti:[38],pc:[86]};
async function raiseBaton(){ await sound.unlock(); await preload(); baton=3; const pr=new Set(present()); const order=ORDER.filter(s=>pr.has(s));
  order.forEach((sid,i)=>motif(sid,.45,i*.42,.3)); const t=order.length*.42+.3;
  order.forEach(sid=>CHORD[sid].forEach(m=>P(S[sid][3],m,{when:sound.now()+t,dur:3.4,vel:.5,voices:2,pan:sectionPan(sid),tag:sid}))); baton=Math.max(baton,(t+3)*.35); }
$('bMore').onclick=()=>{ const i=$('info'); i.classList.toggle('more'); $('bMore').setAttribute('aria-expanded',i.classList.contains('more')); $('bMore').textContent=i.classList.contains('more')?'Less':'About this era'; };
$('tutti').onclick=()=>{ clearTimeout(syncTimer); pendingSync=false; raiseBaton(); };
// ---------- boot from URL: #era=baroque  #piece=m40  #composer=gustav-mahler  #instrument=cello ----------
const hp=new URLSearchParams(location.hash.slice(1));
const pp=PIECES.find(p=>p.id===hp.get('piece'));
if(pp) setPiece(pp); else if(hp.get('composer')&&COMP[hp.get('composer')]) setComposer(hp.get('composer')); else setEra(L[hp.get('era')]?hp.get('era'):'classical');
if(hp.get('instrument')) setInstrument(hp.get('instrument'));
document.fonts?.ready.then(()=>fitCamera());
let last=performance.now(); if(hp.has('still')) for(let i=0;i<400;i++) step(1/30);
function loop(now){ const dt=Math.min(.05,(now-last)/1000); last=now; step(dt); render(); requestAnimationFrame(loop);} requestAnimationFrame(loop);
</script>
