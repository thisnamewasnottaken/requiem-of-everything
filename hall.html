 {id:'seasons',label:'Vivaldi · The Four Seasons',era:'baroque',year:'1725 · Venice',lead:'A solo violin against strings and continuo',text:'No winds at all. Birdsong, storms and shivering frost are painted by strings alone over the harpsichord\u2019s pulse.',mod:{ob:0,tp:0,ti:0,bn:0,v1:5,v2:5,va:3}},

// ---------- seats ----------
const ringR=r=>1.55+r*1.05;
function layoutSeats(defs){ const out=[]; for(const [sid,n,ring,a0,a1] of defs){ if(!n)continue; let placed=0,row=0; while(placed<n){ const R=ringR(ring)+row*.5, arc=(a1-a0)*Math.PI/180*R, per=Math.max(1,Math.min(n-placed,Math.floor(arc/.46)));
    for(let k=0;k<per;k++){ const th=(a0+(a1-a0)*(per===1?.5:(k+.5)/per))*Math.PI/180; out.push({key:sid+':'+(placed+k),sid,x:-Math.cos(th)*R,z:Math.sin(th)*R}); } placed+=per; row++; } } return out; }
let seats=new Map(), current={}, active={}, hoverS=null, cardS=null, mouse={x:0,y:0};
function apply(defs,meta){ current=meta; const tgt=layoutSeats(defs); const keep=new Set();
  for(const t of tgt){ keep.add(t.key); let s=seats.get(t.key); if(!s){ s={...t,cx:t.x*.2,cz:t.z+3,a:0,ph:Math.random()*6.28}; seats.set(t.key,s);} s.x=t.x; s.z=t.z; s.dead=false; }
  for(const [k,s] of seats) if(!keep.has(k)) s.dead=true;
  document.getElementById('iYear').textContent=meta.year; document.getElementById('iName').textContent=meta.name; document.getElementById('iLead').textContent=meta.lead;
  document.getElementById('iText').textContent=meta.text; document.getElementById('iCount').textContent=tgt.length+' performers on stage'; }
function setEra(id){ apply(L[id].s,L[id]); mark(id,null); }
function setPiece(p){ const base=L[p.era].s.map(d=>{const c=[...d]; if(p.mod&&p.mod[c[0]]!==undefined)c[1]=p.mod[c[0]]; return c;}); apply([...base,...(p.add||[])],{...p,name:p.label.split(' · ')[1]}); mark(p.era,p.id); }
const eraBox=document.getElementById('eras'), pBox=document.getElementById('pieces');
Object.entries(L).forEach(([id,l])=>{const b=document.createElement('button');b.className='btn';b.textContent=id;b.dataset.id=id;b.onclick=()=>setEra(id);eraBox.appendChild(b);});
PIECES.forEach(p=>{const b=document.createElement('button');b.className='btn';b.textContent=p.label;b.dataset.id=p.id;b.onclick=()=>setPiece(p);pBox.appendChild(b);});
function mark(era,piece){ eraBox.querySelectorAll('.btn').forEach(b=>b.classList.toggle('on',b.dataset.id===era&&!piece)); pBox.querySelectorAll('.btn').forEach(b=>b.classList.toggle('on',b.dataset.id===piece)); }
// ---------- projection ----------
function proj(x,z){ const d=9, k=d/(z+d), sx=Math.min(W*.062,H*.11); return {x:W*.5+x*sx*k, y:H*.80-(1-k)*H*.98, p:k*Math.min(1.25,H/800)}; }
// ---------- draw ----------
let T=0;
function draw(dt){ T+=dt;
  g.globalCompositeOperation='source-over'; g.fillStyle='#090706'; g.fillRect(0,0,W,H);
  g.globalCompositeOperation='lighter';
  // shafts from high windows
  for(let i=0;i<5;i++){ const sx=W*(.2+i*.15)+Math.sin(T*.1+i)*20, w=W*.06; const gr=g.createLinearGradient(0,0,0,H*.9); gr.addColorStop(0,'rgba(255,190,120,.05)'); gr.addColorStop(1,'rgba(255,190,120,0)');
    g.fillStyle=gr; g.beginPath(); g.moveTo(sx-w*.3,0); g.lineTo(sx+w*.3,0); g.lineTo(sx+w*1.8+(i-2)*60,H*.9); g.lineTo(sx-w*1.2+(i-2)*60,H*.9); g.fill(); }
  // stage floor glow
  const c0=proj(0,2.5); const fg=g.createRadialGradient(c0.x,c0.y,0,c0.x,c0.y,W*.5); fg.addColorStop(0,'rgba(255,170,90,.10)'); fg.addColorStop(1,'rgba(255,170,90,0)'); g.fillStyle=fg; g.fillRect(0,0,W,H);
  // risers
  g.lineWidth=1; for(let r=0;r<=6;r++){ const R=ringR(r)-.25; g.beginPath(); for(let a=0;a<=180;a+=3){ const th=a*Math.PI/180, q=proj(-Math.cos(th)*R,Math.sin(th)*R); a?g.lineTo(q.x,q.y):g.moveTo(q.x,q.y);} g.strokeStyle=`rgba(201,165,92,${.16-r*.015})`; g.stroke(); }
  // section spotlights
  const cent={}; for(const s of seats.values()){ if(s.dead)continue; const c=cent[s.sid]||(cent[s.sid]={x:0,z:0,n:0}); c.x+=s.x;c.z+=s.z;c.n++; }
  for(const sid in cent){ const lvl=Math.max(active[sid]||0, sid===hoverS?.55:0, sid===cardS?.7:0); if(lvl<.02)continue; const c=cent[sid], q=proj(c.x/c.n,c.z/c.n); const col=FAM[S[sid][1]];
    const rad=40+Math.sqrt(c.n)*22*q.p; const gr=g.createLinearGradient(q.x,0,q.x,q.y); gr.addColorStop(0,col+'00'); gr.addColorStop(1,col+Math.round(lvl*60).toString(16).padStart(2,'0'));
    g.fillStyle=gr; g.beginPath(); g.moveTo(q.x-rad*.15,0); g.lineTo(q.x+rad*.15,0); g.lineTo(q.x+rad,q.y); g.lineTo(q.x-rad,q.y); g.fill();
    const pg=g.createRadialGradient(q.x,q.y,0,q.x,q.y,rad*1.2); pg.addColorStop(0,col+Math.round(lvl*90).toString(16).padStart(2,'0')); pg.addColorStop(1,col+'00'); g.fillStyle=pg; g.beginPath(); g.ellipse(q.x,q.y,rad*1.2,rad*.45,0,0,7); g.fill(); }
  // musicians (back to front)
  const arr=[...seats.values()].sort((a,b)=>b.cz-a.cz); const k=Math.min(1,dt*3.2);
  for(const s of arr){ s.cx+=(s.x-s.cx)*k; s.cz+=(s.z-s.cz)*k; s.a+=((s.dead?0:1)-s.a)*Math.min(1,dt*2.5); if(s.dead&&s.a<.01){seats.delete(s.key);continue;}
    const q=proj(s.cx,s.cz), col=FAM[S[s.sid][1]], lvl=Math.max(active[s.sid]||0, s.sid===hoverS?.5:0, s.sid===cardS?.6:0);
    const sway=Math.sin(T*(1.2+lvl*5)+s.ph)*(1+lvl*3)*q.p; const r=(6+lvl*3.5)*q.p; const y=q.y-10*q.p+sway*.4;
    const halo=g.createRadialGradient(q.x,y,0,q.x,y,r*(5+lvl*2.2)); halo.addColorStop(0,col+(lvl>.1?'cc':'aa')); halo.addColorStop(.3,col+(lvl>.1?'55':'2a')); halo.addColorStop(1,col+'00');
    g.globalAlpha=s.a; g.fillStyle=halo; g.fillRect(q.x-r*10,y-r*10,r*20,r*20);
    g.fillStyle='rgba(20,14,10,.9)'; g.beginPath(); g.ellipse(q.x,y+r*1.3,r*.9,r*1.1,0,Math.PI,0); g.fill(); g.strokeStyle=col+'aa'; g.lineWidth=.8; g.stroke(); g.fillStyle='rgba(255,236,200,.95)'; g.beginPath(); g.arc(q.x,y-r*.1,r*.5,0,7); g.fill();
    g.fillStyle='rgba(255,200,130,.35)'; g.fillRect(q.x-r*.9,q.y-2*q.p,r*1.8,1.2*q.p); g.globalAlpha=1; } // stand light
  // conductor & baton
  const pc=proj(0,-.2); g.fillStyle='rgba(239,212,151,.9)'; g.beginPath(); g.arc(pc.x,pc.y-16,5,0,7); g.fill();
  const bx=pc.x+(mouse.x-pc.x)*.06, by=pc.y-22+(mouse.y-pc.y)*.04-Math.abs(Math.sin(T*2.2))*6;
  g.strokeStyle='rgba(255,240,210,.85)'; g.lineWidth=1.3; g.beginPath(); g.moveTo(pc.x+3,pc.y-19); g.lineTo(bx+18,by-14); g.stroke();
  const bg=g.createRadialGradient(bx+18,by-14,0,bx+18,by-14,30); bg.addColorStop(0,'rgba(255,240,210,.5)'); bg.addColorStop(1,'rgba(255,240,210,0)'); g.fillStyle=bg; g.fillRect(bx-12,by-44,60,60);
  const pg=g.createRadialGradient(pc.x,pc.y,0,pc.x,pc.y,60); pg.addColorStop(0,'rgba(239,212,151,.25)'); pg.addColorStop(1,'rgba(239,212,151,0)'); g.fillStyle=pg; g.beginPath(); g.ellipse(pc.x,pc.y,60,16,0,0,7); g.fill();
  g.globalCompositeOperation='source-over';
  for(const sid in active) active[sid]*=Math.pow(.25,dt);
}
// ---------- interaction & sound ----------
const tip=document.getElementById('tip'); let lastPlay=0;
function pickSection(mx,my){ let best=null,bd=1e9; for(const s of seats.values()){ if(s.dead)continue; const q=proj(s.cx,s.cz); const d=Math.hypot(q.x-mx,q.y-10*q.p-my); if(d<bd&&d<26*q.p+6){bd=d;best=s.sid;} } return best; }
cv.addEventListener('pointermove',e=>{ mouse={x:e.clientX,y:e.clientY}; const s=pickSection(e.clientX,e.clientY);
  if(s!==hoverS){ hoverS=s; if(s&&sound.started&&performance.now()-lastPlay>160){lastPlay=performance.now(); motif(s,.4);} }
  if(s){ const n=[...seats.values()].filter(o=>o.sid===s&&!o.dead).length; tip.innerHTML=`<b>${S[s][0]}</b><span>${n} player${n>1?'s':''} · ${S[s][1]}</span>`; tip.style.opacity=1; tip.style.left=(e.clientX+16)+'px'; tip.style.top=(e.clientY+16)+'px'; cv.style.cursor='pointer'; }
  else { tip.style.opacity=0; cv.style.cursor=''; } });
cv.addEventListener('click',e=>{ sound.unlock(); preload(); const s=pickSection(e.clientX,e.clientY); if(s) openCard(s); else closeCard(); });
function sectionPan(sid){ const s=[...seats.values()].filter(o=>o.sid===sid&&!o.dead); if(!s.length)return 0; return Math.max(-.9,Math.min(.9,s.reduce((a,o)=>a+o.x,0)/s.length/6)); }
function motif(sid,vel=.55,t0=0,step=.28){ const [,,,patch,notes]=S[sid]; const n=[...seats.values()].filter(o=>o.sid===sid&&!o.dead).length; const voices=Math.min(4,Math.max(1,Math.round(Math.sqrt(n))));
  notes.forEach((m,i)=>sound.play(patch,m,{when:sound.now()+t0+i*step,dur:step*1.6,vel,voices,pan:sectionPan(sid),tag:sid})); }
sound.onNote(n=>{ if(!n.tag)return; const delay=Math.max(0,(n.when-sound.now())*1000); setTimeout(()=>{active[n.tag]=Math.min(1,(active[n.tag]||0)*.5+.9*n.vel+.3);},delay); });
function preload(){ new Set(Object.values(S).map(s=>s[3])).forEach(p=>sound.load(p)); }
const ERAS=['renaissance','baroque','classical','early-romantic','late-romantic','modern'];
function openCard(sid){ cardS=sid; const [label,fam,iid]=S[sid]; const I=INST[iid]||{}; document.getElementById('cFam').textContent=fam+' · '+label;
  document.getElementById('cName').textContent=I.name||label; document.getElementById('cRange').textContent=I.range?'Range '+I.range:''; document.getElementById('cRole').textContent=I.role||''; document.getElementById('cDesc').textContent=I.description||'';
  const pr=Object.fromEntries((I.eraProminence||[]).map(p=>[p.era,p.prominence])); const H={primary:1,secondary:.6,occasional:.3,rare:.15};
  document.getElementById('cEras').innerHTML=ERAS.map(e=>`<span><i style="height:${(H[pr[e]]||0)*100}%"></i>${e.replace('-romantic','-rom')}</span>`).join('');
  document.getElementById('card').classList.add('open'); if(sound.started) motif(sid,.6,0,.34); }
function closeCard(){ cardS=null; document.getElementById('card').classList.remove('open'); }
document.getElementById('cClose').onclick=closeCard; document.getElementById('cHear').onclick=()=>{sound.unlock();cardS&&motif(cardS,.7,0,.4);};
document.getElementById('tutti').onclick=async()=>{ await sound.unlock(); preload();
  // a slow swell: low strings, then winds, brass, everything on a final chord
  const present=new Set([...seats.values()].filter(o=>!o.dead).map(o=>o.sid)); const order=['cb','vc','viol','va','v2','v1','hc','fp','lute','org','ch','rec','bn','cl','ob','fl','pic','cor','sack','hn','tb','tu','tp','hp','cel','ti','pc'].filter(s=>present.has(s));
  order.forEach((sid,i)=>motif(sid,.45,i*.42,.3));
  const chord={cb:[38],vc:[50,57],va:[62],v2:[66],v1:[74,78],viol:[50,57],hc:[62,66,69],fp:[62,66,69],org:[38,50,57],ch:[62,66,69,74],lute:[62,69],rec:[74],bn:[50],cl:[69],ob:[74],fl:[81],pic:[86],cor:[74],sack:[50,57],hn:[62,66],tb:[50,57],tu:[38],tp:[74,78],hp:[50,57,62,66,69,74],cel:[86,90],ti:[38],pc:[86]};
  const t=order.length*.42+.3; order.forEach(sid=>chord[sid].forEach(m=>sound.play(S[sid][3],m,{when:sound.now()+t,dur:3.4,vel:.5,voices:2,pan:sectionPan(sid),tag:sid}))); };
// deep links: #era=baroque  #piece=m40  #instrument=cello  #lit=v1,hn
const hp=new URLSearchParams(location.hash.slice(1));
const pp=PIECES.find(p=>p.id===hp.get('piece')); pp?setPiece(pp):setEra(hp.get('era')||'classical');
if(hp.get('instrument')){ const sid=Object.keys(S).find(k=>S[k][2]===hp.get('instrument')); if(sid) setTimeout(()=>openCard(sid),50); }
let last=performance.now(); if(hp.has('still')) for(let i=0;i<200;i++) draw(1/30);
function loop(now){ const dt=Math.min(.05,(now-last)/1000); last=now; if(hp.get('lit')) hp.get('lit').split(',').forEach(s=>active[s]=1); draw(dt); requestAnimationFrame(loop);} requestAnimationFrame(loop);
</script>
</body>
